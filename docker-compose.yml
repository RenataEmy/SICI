services:
  db:
    image: postgres:16-alpine
    container_name: sici-db
    environment:
      POSTGRES_DB: sicidatabase
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - sici-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sicidatabase"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: DockerFile
    container_name: sici-api
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/sicidatabase}
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-admin}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sici-postgres-data:
